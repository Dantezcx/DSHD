<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>DSH 移动端</title>
<style>
  :root {
    --bg: #0d1117; --card: #161b22; --border: #21262d;
    --text: #e6edf3; --text2: #8b949e; --text3: #6e7681;
    --accent: #2f81f7; --accent-soft: #1c2a3d;
    --user-bubble: #2f81f7; --user-text: #ffffff;
    --ai-bubble: #1c2129; --ai-text: #e6edf3;
    --ok: #3fb950; --bad: #f85149; --warn: #d29922;
    --radius: 14px;
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: column; min-height: 100dvh;
    overscroll-behavior-y: none;
  }

  /* ===== 会话列表页 ===== */
  .topbar {
    background: var(--card); border-bottom: 1px solid var(--border);
    padding: calc(12px + var(--safe-t)) 16px 12px;
    display: flex; align-items: center; gap: 10px; flex: none;
  }
  .topbar .title { font-size: 17px; font-weight: 700; flex: 1; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--accent-soft); color: var(--accent);
    border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600;
  }
  .chip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }

  .content { flex: 1; overflow-y: auto; padding: 14px 14px calc(14px + var(--safe-b)); }
  .session {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 15px 16px; margin-bottom: 10px; cursor: pointer; display: flex;
    align-items: center; gap: 12px; transition: background .12s;
  }
  .session:active { background: #fafbfc; }
  .session .avatar {
    width: 42px; height: 42px; border-radius: 12px; flex: none;
    background: var(--accent-soft); color: var(--accent);
    display: flex; align-items: center; justify-content: center; font-size: 19px;
  }
  .session .body { flex: 1; min-width: 0; }
  .session .name { font-size: 15px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .session .meta { font-size: 12px; color: var(--text3); margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .session .arrow { color: var(--text3); font-size: 18px; flex: none; }
  .session .live { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; }

  .empty { color: var(--text3); text-align: center; padding: 60px 0; font-size: 14px; }
  .loading { color: var(--text3); text-align: center; padding: 40px 0; font-size: 14px; }

  /* ===== 聊天页 ===== */
  .chatbar {
    background: var(--card); border-bottom: 1px solid var(--border);
    padding: calc(10px + var(--safe-t)) 8px 10px;
    display: flex; align-items: center; gap: 4px; flex: none;
  }
  .chatbar .back {
    border: none; background: none; font-size: 24px; color: var(--text);
    padding: 2px 10px; cursor: pointer; line-height: 1;
  }
  .chatbar .c-title { flex: 1; font-size: 15px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chatbar .c-status { font-size: 12px; color: var(--text3); flex: none; padding-right: 8px; }
  .chatbar .c-status.running { color: var(--ok); }

  .msgs {
    flex: 1; overflow-y: auto; padding: 16px 14px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .m { display: flex; flex-direction: column; max-width: 84%; }
  .m.user { align-self: flex-end; align-items: flex-end; }
  .m.ai { align-self: flex-start; align-items: flex-start; }
  .m .bubble {
    padding: 11px 14px; border-radius: 16px; font-size: 15px; line-height: 1.55;
    word-break: break-word; white-space: pre-wrap;
  }
  .m.user .bubble { background: var(--user-bubble); color: var(--user-text); border-bottom-right-radius: 5px; }
  .m.ai .bubble { background: var(--ai-bubble); color: var(--ai-text); border: 1px solid var(--border); border-bottom-left-radius: 5px; }
  .m .time { font-size: 11px; color: var(--text3); margin-top: 4px; padding: 0 4px; }
  .m .tool-note { font-size: 12px; color: var(--text3); background: var(--card); border: 1px dashed var(--border); border-radius: 10px; padding: 6px 10px; margin-top: 2px; }

  .typing { display: inline-flex; gap: 4px; padding: 12px 16px; background: var(--ai-bubble); border: 1px solid var(--border); border-radius: 16px; }
  .typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--text3); animation: blink 1.2s infinite; }
  .typing i:nth-child(2) { animation-delay: .2s; }
  .typing i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%,80%,100% { opacity: .3; } 40% { opacity: 1; } }

  /* 输入栏 */
  .inputbar {
    background: var(--card); border-top: 1px solid var(--border);
    padding: 10px 12px calc(10px + var(--safe-b));
    display: flex; align-items: flex-end; gap: 8px; flex: none;
  }
  .inputbar textarea {
    flex: 1; border: 1px solid var(--border); border-radius: 20px; background: var(--bg);
    font: 15px inherit; color: var(--text); padding: 10px 14px; resize: none;
    max-height: 120px; outline: none;
  }
  .inputbar textarea:focus { border-color: var(--accent); }
  .inputbar .send {
    width: 42px; height: 42px; border-radius: 50%; border: none; flex: none;
    background: var(--accent); color: #fff; font-size: 17px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: opacity .15s, transform .1s;
  }
  .inputbar .send:active { transform: scale(.92); }
  .inputbar .send:disabled { opacity: .4; }

  .toast {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(110px + var(--safe-b));
    background: rgba(26,29,33,.85); color: #fff; font-size: 13px;
    padding: 8px 16px; border-radius: 999px; opacity: 0; pointer-events: none;
    transition: opacity .2s; z-index: 99; max-width: 80vw; text-align: center;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<!-- ===== 会话列表 ===== -->
<div id="view-sessions" style="display:flex;flex-direction:column;height:100dvh;">
  <div class="topbar">
    <div class="title">对话</div>
    <div class="chip" id="balance-chip">余额 …</div>
  </div>
  <div class="content" id="session-list"><div class="loading">加载中…</div></div>
</div>

<!-- ===== 聊天 ===== -->
<div id="view-chat" style="display:none;flex-direction:column;height:100dvh;">
  <div class="chatbar">
    <button class="back" id="btn-back">‹</button>
    <div class="c-title" id="chat-title">会话</div>
    <div class="c-status" id="chat-status"></div>
  </div>
  <div class="msgs" id="msg-list"></div>
  <div class="inputbar">
    <textarea id="input" rows="1" placeholder="发消息…"></textarea>
    <button class="send" id="btn-send">➤</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtTime = ts => {
  if (!ts) return "";
  const d = new Date(ts);
  const p = n => String(n).padStart(2, "0");
  return p(d.getHours()) + ":" + p(d.getMinutes());
};
const fmtAgo = ts => {
  if (!ts) return "";
  const diff = Date.now() - ts;
  if (diff < 60000) return "刚刚";
  if (diff < 3600000) return Math.floor(diff / 60000) + " 分钟前";
  if (diff < 86400000) return Math.floor(diff / 3600000) + " 小时前";
  return new Date(ts).toLocaleDateString("zh-CN", { month: "numeric", day: "numeric" });
};
let toastTimer = null;
function toast(text) {
  const t = $("toast");
  t.textContent = text;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2500);
}
async function api(path, body) {
  const r = await fetch("/api/" + path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body || {}),
  });
  const j = await r.json().catch(() => ({}));
  if (!j || j.ok === false) throw new Error((j && j.msg) || "请求失败");
  return j;
}

/* ========== 余额 ========== */
let balanceCache = 0;
async function loadBalance() {
  try {
    const r = await api("mob/balance", {});
    const b = r.balance;
    balanceCache = (typeof b === "number" && isFinite(b)) ? b : 0;
    $("balance-chip").innerHTML = '<span class="dot"></span>余额 ¥' + balanceCache.toFixed(2);
  } catch (e) {
    $("balance-chip").textContent = "余额 —";
  }
}

/* ========== 会话列表 ========== */
let sessions = [];
async function loadSessions() {
  const box = $("session-list");
  box.innerHTML = '<div class="loading">加载中…</div>';
  try {
    const r = await api("mob/sessions", {});
    sessions = r.items || [];
  } catch (e) {
    box.innerHTML = '<div class="empty">加载失败：' + esc(e.message) + '</div>';
    return;
  }
  if (!sessions.length) {
    box.innerHTML = '<div class="empty">暂无会话<br><br><a href="/m" style="color:var(--accent)">刷新</a></div>';
    return;
  }
  box.innerHTML = sessions.map(s => `
    <div class="session" data-id="${esc(s.id)}">
      <div class="avatar">${esc((s.title || "?")[0])}</div>
      <div class="body">
        <div class="name">${esc(s.title || s.id.slice(0, 18))}</div>
        <div class="meta">${esc(s.cwd || "—")} · ${fmtAgo(s.updatedAt)}</div>
      </div>
      ${s.running ? '<span class="live" title="进行中"></span>' : ""}
      <span class="arrow">›</span>
    </div>`).join("");
  box.querySelectorAll(".session").forEach(el => el.addEventListener("click", () => openChat(el.dataset.id)));
}

/* ========== 聊天 ========== */
let current = null;      // { id, title }
let pollTimer = null;
let lastText = "";       // 轮询去重
let pollCount = 0;

function showView(name) {
  $("view-sessions").style.display = name === "sessions" ? "flex" : "none";
  $("view-chat").style.display = name === "chat" ? "flex" : "none";
}

function openChat(id) {
  const s = sessions.find(x => x.id === id);
  current = { id, title: (s && s.title) || "会话" };
  $("chat-title").textContent = current.title;
  $("chat-status").textContent = s && s.running ? "进行中" : "";
  $("chat-status").className = "c-status" + ((s && s.running) ? " running" : "");
  $("msg-list").innerHTML = "";
  showView("chat");
  lastText = "";
  pollCount = 0;
  loadHistory();
  startPolling();
}

function renderMessages(msgs) {
  const box = $("msg-list");
  const frag = document.createDocumentFragment();
  for (const m of msgs) {
    if (m.role === "user") {
      const div = document.createElement("div");
      div.className = "m user";
      div.innerHTML = '<div class="bubble">' + esc(m.text) + '</div><div class="time">' + fmtTime(m.ts) + '</div>';
      frag.appendChild(div);
    } else if (m.role === "assistant") {
      const div = document.createElement("div");
      div.className = "m ai";
      if (m.text) {
        div.innerHTML = '<div class="bubble">' + esc(m.text) + '</div><div class="time">' + fmtTime(m.ts) + '</div>';
      } else {
        div.innerHTML = '<div class="tool-note">⚙ 工具执行</div>';
      }
      frag.appendChild(div);
    }
  }
  box.appendChild(frag);
  box.scrollTop = box.scrollHeight;
}

async function loadHistory() {
  if (!current) return;
  try {
    const r = await api("mob/history", { id: current.id });
    if (r.messages && r.messages.length) {
      const key = r.messages[r.messages.length - 1].text || "";
      if (key !== lastText) {
        $("msg-list").innerHTML = "";
        renderMessages(r.messages);
        lastText = key;
      }
    }
    // 进行中状态
    const running = !!r.running;
    $("chat-status").textContent = running ? "正在回复…" : "";
    $("chat-status").className = "c-status" + (running ? " running" : "");
    if (running) showTyping();
    else hideTyping();
    return running;
  } catch (e) {
    return false;
  }
}

function showTyping() {
  if ($("typing-ind")) return;
  const d = document.createElement("div");
  d.className = "m ai";
  d.id = "typing-ind";
  d.innerHTML = '<div class="typing"><i></i><i></i><i></i></div>';
  $("msg-list").appendChild(d);
  $("msg-list").scrollTop = $("msg-list").scrollHeight;
}
function hideTyping() {
  const t = $("typing-ind");
  if (t) t.remove();
}

function startPolling() {
  stopPolling();
  pollTimer = setInterval(async () => {
    if (!current) return;
    pollCount++;
    const running = await loadHistory();
    if (!running && pollCount > 2) stopPolling();
    if (pollCount > 150) stopPolling();
  }, 2000);
}
function stopPolling() {
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
}

async function send() {
  const input = $("input");
  const text = input.value.trim();
  if (!text || !current) return;
  input.value = "";
  input.style.height = "auto";
  $("btn-send").disabled = true;
  try {
    await api("mob/send", { id: current.id, text });
    renderMessages([{ role: "user", text, ts: Date.now() }]);
    lastText = "";
    pollCount = 0;
    startPolling();
    setTimeout(() => loadHistory(), 500);
  } catch (e) {
    toast("发送失败：" + e.message);
    input.value = text;
  } finally {
    $("btn-send").disabled = false;
  }
}

/* ========== 事件 ========== */
$("btn-back").addEventListener("click", () => { stopPolling(); current = null; showView("sessions"); loadSessions(); });
$("btn-send").addEventListener("click", send);
const ta = $("input");
ta.addEventListener("input", () => { ta.style.height = "auto"; ta.style.height = Math.min(ta.scrollHeight, 120) + "px"; });
ta.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } });

/* ========== 启动 ========== */
loadBalance();
setInterval(loadBalance, 30000);
loadSessions();
</script>
</body>
</html>

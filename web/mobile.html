<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>DSH 移动端</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #21262d;
    --text: #e6edf3; --text2: #8b949e; --text3: #6e7681;
    --accent: #2f81f7; --ok: #3fb950; --bad: #f85149; --warn: #d29922;
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: column; min-height: 100dvh;
    overscroll-behavior-y: none;
  }
  /* 顶部状态栏 */
  .statusbar {
    background: var(--panel); border-bottom: 1px solid var(--border);
    padding: 10px 16px; display: flex; align-items: center; gap: 10px;
    padding-top: calc(10px + env(safe-area-inset-top, 0px));
    flex: none;
  }
  .statusbar .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; background: var(--warn); }
  .statusbar.online .dot { background: var(--ok); }
  .statusbar.offline .dot { background: var(--bad); }
  .statusbar .svc { font-weight: 600; font-size: 14px; }
  .statusbar .meta { color: var(--text3); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; text-align: right; }
  /* 内容区 */
  .content { flex: 1; overflow-y: auto; padding: 14px; padding-bottom: calc(14px + var(--safe-b)); }
  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 14px; padding: 16px; margin-bottom: 14px;
  }
  .card h3 { font-size: 13px; color: var(--text3); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
  .row { display: flex; align-items: center; justify-content: space-between; padding: 11px 0; border-bottom: 1px solid rgba(33,38,45,.6); gap: 10px; }
  .row:last-child { border-bottom: none; }
  .row .k { color: var(--text2); font-size: 14px; flex: none; }
  .row .v { color: var(--text); font-weight: 600; font-size: 15px; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 60%; }
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stat { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 14px; }
  .stat .k { color: var(--text3); font-size: 11px; }
  .stat .v { font-size: 18px; font-weight: 700; margin-top: 4px; font-variant-numeric: tabular-nums; }
  /* 按钮 */
  .btn {
    display: block; width: 100%; padding: 14px; border-radius: 12px;
    border: none; font-size: 16px; font-weight: 600; cursor: pointer;
    background: var(--accent); color: #fff; margin-bottom: 10px;
    transition: transform .1s, opacity .15s; touch-action: manipulation;
  }
  .btn:active { transform: scale(.97); opacity: .9; }
  .btn.ghost { background: var(--panel); color: var(--text); border: 1px solid var(--border); }
  .btn.danger { background: transparent; color: var(--bad); border: 1px solid var(--bad); }
  .btn.small { padding: 10px; font-size: 14px; }
  .btn-row { display: flex; gap: 10px; }
  .btn-row .btn { flex: 1; margin-bottom: 0; }
  /* 表单 */
  input, select {
    width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text);
    border-radius: 10px; padding: 12px 14px; font-size: 16px; margin-bottom: 10px;
    -webkit-appearance: none; appearance: none;
  }
  input:focus { outline: none; border-color: var(--accent); }
  .field { margin-bottom: 4px; }
  .field label { display: block; color: var(--text2); font-size: 13px; margin-bottom: 6px; }
  .chk { display: flex; align-items: center; gap: 8px; padding: 8px 0; font-size: 14px; color: var(--text2); }
  .chk input { width: 20px; height: 20px; margin: 0; accent-color: var(--accent); }
  /* 底部导航 */
  .tabbar {
    display: flex; background: var(--panel); border-top: 1px solid var(--border);
    padding-bottom: var(--safe-b); flex: none;
  }
  .tabbar .tab {
    flex: 1; padding: 9px 0 10px; text-align: center; color: var(--text3);
    font-size: 11px; cursor: pointer; position: relative; touch-action: manipulation;
  }
  .tabbar .tab .ic { font-size: 20px; display: block; margin-bottom: 2px; }
  .tabbar .tab.active { color: var(--accent); }
  .tabbar .tab.active::after {
    content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%);
    width: 40px; height: 3px; border-radius: 0 0 3px 3px; background: var(--accent);
  }
  .page { display: none; flex: 1; flex-direction: column; min-height: 0; }
  .page.active { display: flex; }
  .msg {
    padding: 11px 14px; border-radius: 10px; font-size: 13px; margin: 10px 0;
    display: none; word-break: break-all;
  }
  .msg.show { display: block; }
  .msg.ok { background: rgba(63,185,80,.12); color: var(--ok); }
  .msg.bad { background: rgba(248,81,73,.12); color: var(--bad); }
  .msg.warn { background: rgba(210,153,34,.12); color: var(--warn); }
  .item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 13px 0; border-bottom: 1px solid rgba(33,38,45,.6); gap: 10px;
  }
  .item:last-child { border-bottom: none; }
  .item .t { font-size: 14px; font-weight: 500; }
  .item .d { color: var(--text3); font-size: 12px; margin-top: 2px; }
  .link { color: var(--accent); font-size: 13px; }
  .badge { display: inline-block; padding: 2px 7px; border-radius: 10px; font-size: 11px; background: rgba(47,129,247,.15); color: var(--accent); margin-left: 6px; }
  .seg { display: flex; gap: 8px; margin-bottom: 12px; }
  .seg .s { flex: 1; text-align: center; padding: 9px; border-radius: 10px; border: 1px solid var(--border); color: var(--text2); font-size: 14px; }
  .seg .s.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .empty { color: var(--text3); text-align: center; padding: 30px 0; font-size: 14px; }
</style>
</head>
<body>
<!-- 状态栏 -->
<div class="statusbar" id="statusbar">
  <span class="dot"></span>
  <span class="svc" id="svc">检测中…</span>
  <span class="meta" id="meta"></span>
</div>

<!-- 页面: 首页 -->
<div class="page active" id="page-home">
  <div class="content">
    <div class="stat-grid" id="home-stats"></div>
    <div class="card" style="margin-top:14px">
      <h3>快速操作</h3>
      <button class="btn" onclick="openMain()">💬 打开 DSH 对话</button>
      <div class="btn-row">
        <button class="btn ghost" onclick="goTab('sync')">同步</button>
        <button class="btn ghost" onclick="goTab('backup')">备份</button>
      </div>
    </div>
    <div class="card">
      <h3>同步状态</h3>
      <div id="sync-status">加载中…</div>
    </div>
  </div>
</div>

<!-- 页面: 同步 -->
<div class="page" id="page-sync">
  <div class="content">
    <h2 style="font-size:18px;margin-bottom:12px">数据同步</h2>
    <div class="seg" id="sync-seg">
      <div class="s active" data-method="git">Git</div>
      <div class="s" data-method="webdav">WebDAV</div>
    </div>
    <div class="card">
      <div id="sync-form">
        <div class="field" id="f-git"><label>Git 远程仓库</label><input id="git-remote" placeholder="git@github.com:user/dsh-sync.git"></div>
        <div class="field hidden" id="f-dav-url"><label>WebDAV 地址</label><input id="dav-url" placeholder="https://your-dav.com/dav"></div>
        <div class="field hidden" id="f-dav-user"><label>用户名</label><input id="dav-user"></div>
        <div class="field hidden" id="f-dav-pass"><label>密码</label><input id="dav-pass" type="password"></div>
        <label class="chk"><input type="checkbox" id="c-auto"> 自动同步</label>
        <div class="field" style="margin-top:6px"><label>同步间隔（分钟）</label><input id="c-interval" type="number" value="30" min="1" inputmode="numeric"></div>
      </div>
      <button class="btn" onclick="saveSync()">保存配置</button>
      <div class="btn-row">
        <button class="btn ghost" onclick="syncNow()">立即同步</button>
        <button class="btn ghost" onclick="testSync()">测试连接</button>
      </div>
      <button class="btn danger" onclick="restoreSync()">从云端恢复</button>
      <div id="sync-msg" class="msg"></div>
    </div>
  </div>
</div>

<!-- 页面: 备份 -->
<div class="page" id="page-backup">
  <div class="content">
    <h2 style="font-size:18px;margin-bottom:12px">备份管理</h2>
    <div class="btn-row" style="margin-bottom:12px">
      <button class="btn" onclick="backupCreate()">创建备份</button>
      <button class="btn ghost" onclick="loadBackup()">刷新</button>
    </div>
    <div id="backup-msg" class="msg"></div>
    <div class="card" id="backup-list"></div>
  </div>
</div>

<!-- 页面: 插件 -->
<div class="page" id="page-plugins">
  <div class="content">
    <h2 style="font-size:18px;margin-bottom:12px">插件市场</h2>
    <div class="seg" id="plugin-seg">
      <div class="s active">搜索</div>
      <div class="s" onclick="openMain()">主界面</div>
    </div>
    <input id="plugin-q" placeholder="搜索 dsh 插件" value="topic:dsh-plugin">
    <button class="btn" onclick="searchPlugins()">搜索</button>
    <div id="plugin-msg" class="msg"></div>
    <div id="plugin-list"></div>
  </div>
</div>

<!-- 底部导航 -->
<div class="tabbar">
  <div class="tab active" data-tab="home"><span class="ic">🏠</span>首页</div>
  <div class="tab" data-tab="sync"><span class="ic">🔄</span>同步</div>
  <div class="tab" data-tab="backup"><span class="ic">💾</span>备份</div>
  <div class="tab" data-tab="plugins"><span class="ic">🧩</span>插件</div>
</div>

<script>
const $ = id => document.getElementById(id);
let method = 'git';
function showMsg(id, text, type) {
  const el = $(id);
  el.textContent = text;
  el.className = 'msg show ' + (type || 'ok');
  setTimeout(() => el.classList.remove('show'), 6000);
}
async function api(path, body) {
  const r = await fetch('/api/' + path, {
    method: body ? 'POST' : 'GET',
    headers: body ? { 'Content-Type': 'application/json' } : {},
    body: body ? JSON.stringify(body) : undefined,
  });
  return r.json();
}
function goTab(name) {
  document.querySelectorAll('.tabbar .tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  $('page-' + name).classList.add('active');
  if (name === 'backup') loadBackup();
  if (name === 'plugins') searchPlugins();
}
document.querySelectorAll('.tabbar .tab').forEach(t => t.addEventListener('click', () => goTab(t.dataset.tab)));
function openMain() { window.open('/proxy?direct=1', '_blank'); }

// 同步方式切换
document.querySelectorAll('#sync-seg .s').forEach(s => s.addEventListener('click', () => {
  document.querySelectorAll('#sync-seg .s').forEach(x => x.classList.remove('active'));
  s.classList.add('active');
  method = s.dataset.method;
  const isGit = method === 'git';
  $('f-git').classList.toggle('hidden', !isGit);
  $('f-dav-url').classList.toggle('hidden', isGit);
  $('f-dav-user').classList.toggle('hidden', isGit);
  $('f-dav-pass').classList.toggle('hidden', isGit);
}));

// 状态栏
async function refreshStatus() {
  try {
    const s = await api('status');
    const bar = $('statusbar');
    bar.className = 'statusbar ' + (s.online ? 'online' : 'offline');
    $('svc').textContent = s.online ? 'DSH 在线' : 'DSH 离线';
    $('meta').textContent = (s.workspace ? s.workspace.slice(-20) + ' · ' : '') + s.sessions + ' 会话';
    // 首页统计
    $('home-stats').innerHTML = [
      ['服务', s.online ? '在线' : '离线', s.online ? 'var(--ok)' : 'var(--bad)'],
      ['会话数', s.sessions, ''],
      ['插件', s.plugins || '—', ''],
      ['余额', s.balance || '—', ''],
    ].map(x => `<div class="stat"><div class="k">${x[0]}</div><div class="v" style="color:${x[2]||'var(--text)'}">${x[1]}</div></div>`).join('');
    // 同步状态
    const sync = s.sync || {};
    const content = sync.content || {};
    $('sync-status').innerHTML = `
      <div class="row"><span class="k">方式</span><span class="v">${sync.method ? sync.method.toUpperCase() : '未配置'}</span></div>
      <div class="row"><span class="k">自动</span><span class="v">${sync.auto ? sync.intervalMin + ' 分钟' : '关闭'}</span></div>
      <div class="row"><span class="k">上次同步</span><span class="v">${sync.lastSync ? new Date(sync.lastSync).toLocaleString('zh-CN',{hour12:false}) : '—'}</span></div>
      <div class="row"><span class="k">状态</span><span class="v">${sync.lastStatus || '—'}</span></div>`;
  } catch (e) {}
}
refreshStatus();
setInterval(refreshStatus, 15000);

// 同步
async function loadSyncCfg() {
  const c = await api('sync/get-config');
  $('git-remote').value = (c.git && c.git.remote) || '';
  $('dav-url').value = (c.webdav && c.webdav.url) || '';
  $('dav-user').value = (c.webdav && c.webdav.user) || '';
  $('dav-pass').value = (c.webdav && c.webdav.pass) || '';
  $('c-auto').checked = !!c.auto;
  $('c-interval').value = c.intervalMin || 30;
}
async function saveSync() {
  const cfg = { method, auto: $('c-auto').checked, intervalMin: Number($('c-interval').value) || 30 };
  if (method === 'git') cfg.git = { remote: $('git-remote').value.trim() };
  else cfg.webdav = { url: $('dav-url').value.trim(), user: $('dav-user').value, pass: $('dav-pass').value };
  const r = await api('sync/save-config', cfg);
  showMsg('sync-msg', r.ok !== false ? '✅ 已保存' : '❌ ' + r.msg, r.ok !== false ? 'ok' : 'bad');
}
async function testSync() {
  const p = method === 'git' ? { method: 'git', remote: $('git-remote').value.trim() }
    : { method: 'webdav', webdav: { url: $('dav-url').value.trim(), user: $('dav-user').value, pass: $('dav-pass').value } };
  showMsg('sync-msg', '⏳ 测试中…', 'warn');
  const r = await api('sync/test', p);
  showMsg('sync-msg', (r.ok ? '✅ ' : '❌ ') + r.msg, r.ok ? 'ok' : 'bad');
}
async function syncNow() {
  showMsg('sync-msg', '⏳ 同步中…', 'warn');
  const r = await api('sync/now');
  showMsg('sync-msg', (r.ok ? '✅ ' : '❌ ') + r.msg, r.ok ? 'ok' : 'bad');
  refreshStatus();
}
async function restoreSync() {
  if (!confirm('从云端恢复将覆盖本地数据，确定？')) return;
  showMsg('sync-msg', '⏳ 恢复中…', 'warn');
  const r = await api('sync/restore');
  showMsg('sync-msg', (r.ok ? '✅ ' : '❌ ') + r.msg, r.ok ? 'ok' : 'bad');
}
loadSyncCfg();

// 备份
async function backupCreate() {
  showMsg('backup-msg', '⏳ 创建中…', 'warn');
  const r = await api('backup/create');
  showMsg('backup-msg', (r.ok ? '✅ ' : '❌ ') + r.msg, r.ok ? 'ok' : 'bad');
  loadBackup();
}
async function loadBackup() {
  const r = await api('backup/list');
  if (!r.ok) { $('backup-list').innerHTML = '<div class="empty">' + r.msg + '</div>'; return; }
  if (!r.items.length) { $('backup-list').innerHTML = '<div class="empty">暂无备份</div>'; return; }
  $('backup-list').innerHTML = r.items.map(b => `
    <div class="item">
      <div><div class="t">${b.name}</div><div class="d">${b.date} · ${b.size ? (b.size/1024/1024).toFixed(1)+' MB' : ''}</div></div>
      <span class="link" onclick="backupRestore('${b.name}')">恢复</span>
    </div>`).join('');
}
async function backupRestore(name) {
  if (!confirm('从备份 ' + name + ' 恢复？')) return;
  showMsg('backup-msg', '⏳ 恢复中…', 'warn');
  const r = await api('backup/restore', { name });
  showMsg('backup-msg', (r.ok ? '✅ ' : '❌ ') + r.msg, r.ok ? 'ok' : 'bad');
}

// 插件
let plugins = [];
async function searchPlugins() {
  const q = $('plugin-q').value.trim() || 'topic:dsh-plugin';
  showMsg('plugin-msg', '⏳ 搜索中…', 'warn');
  const r = await api('plugins/search', { q });
  if (!r.ok) { showMsg('plugin-msg', '❌ ' + r.msg, 'bad'); return; }
  plugins = r.items;
  showMsg('plugin-msg', `✅ ${r.total} 个结果`, 'ok');
  $('plugin-list').innerHTML = plugins.map(p => `
    <div class="item">
      <div>
        <div class="t">${p.fullName} <span class="badge">⭐${p.stars}</span></div>
        <div class="d">${p.desc || ''}</div>
      </div>
      <span class="link" onclick="installPlugin('${p.fullName}')">安装</span>
    </div>`).join('') || '<div class="empty">无结果</div>';
}
async function installPlugin(fullName) {
  if (!confirm('安装 ' + fullName + '？')) return;
  showMsg('plugin-msg', '⏳ 安装中…', 'warn');
  const r = await api('plugins/install', { repo: fullName, pkg: '' });
  showMsg('plugin-msg', (r.ok ? '✅ ' : '❌ ') + r.msg, r.ok ? 'ok' : 'bad');
}
</script>
</body>
</html>

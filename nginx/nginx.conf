    ssl_certificate_key /etc/nginx/conf.d/ssl/game.dantezcx.vip.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:8124;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;

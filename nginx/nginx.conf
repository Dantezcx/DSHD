# ============================================================
# DSH HTTPS 反代配置（宿主机 nginx 使用，/etc/nginx/conf.d/dsh.conf）
# 公网 https://game.dantezcx.vip:58123 → 127.0.0.1:8123 (DSH 主界面)
# 公网 https://game.dantezcx.vip:58124 → 127.0.0.1:8124 (管理/移动端)
#
# ⚠️ 关键：dsh 的 /api 浏览器信任检查（browser-trust fence）
#   - settings.describe 等特权 API 只允许 loopback（Host=127.0.0.1）
#   - 所有 /api 要求 Origin.host === Host.host
#   → 反代必须把 Host 和 Origin 都伪装为 127.0.0.1:8123，
#     否则浏览器经域名访问全部 403
# ============================================================
server {
    listen 58123 ssl;
    server_name game.dantezcx.vip;

    ssl_certificate     /etc/nginx/conf.d/ssl/game.dantezcx.vip.pem;
    ssl_certificate_key /etc/nginx/conf.d/ssl/game.dantezcx.vip.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:8123;
        proxy_http_version 1.1;
        # 关键：Host/Origin 伪装 loopback（dsh 特权 API 只允许回环）
        proxy_set_header Host 127.0.0.1:8123;
        proxy_set_header Origin http://127.0.0.1:8123;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Sec-Fetch-Site same-origin;
        proxy_set_header Sec-Fetch-Mode cors;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# DSH 管理服务反代（桌面管理页 + 移动端 UI）
server {
    listen 58124 ssl;
    server_name game.dantezcx.vip;

    ssl_certificate     /etc/nginx/conf.d/ssl/game.dantezcx.vip.pem;
    ssl_certificate_key /etc/nginx/conf.d/ssl/game.dantezcx.vip.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:8124;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

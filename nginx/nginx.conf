# ============================================================
# DSH HTTPS 反代配置（宿主机 nginx 使用）
# 将本文件加入宿主机 nginx（如 /etc/nginx/conf.d/dsh.conf），
# 公网 https://game.dantezcx.vip:58123 → 127.0.0.1:8123
# 支持 WebSocket（DSH 对话/终端需要）
# ============================================================
server {
    listen 58123 ssl;
    server_name game.dantezcx.vip;

    ssl_certificate     /etc/nginx/conf.d/ssl/game.dantezcx.vip.pem;
    ssl_certificate_key /etc/nginx/conf.d/ssl/game.dantezcx.vip.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:8123;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # WebSocket 支持
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

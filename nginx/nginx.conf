# ============================================================
# DSH HTTPS 反代配置（宿主机 nginx 使用）
# 将本文件加入宿主机 nginx（如 /etc/nginx/conf.d/dsh.conf），
# 公网 https://game.dantezcx.vip:58123 → 127.0.0.1:8123
# 支持 WebSocket（DSH 对话/终端需要）
#
# 关键：proxy_set_header Host $http_host（保留端口）
#  dsh 的 /api 信任检查要求 Origin 的 host 与 Host 头完全一致
#  （含端口），$host 不含端口会导致 403
# ============================================================
server {
    listen 58123 ssl;
    server_name game.dantezcx.vip;

    ssl_certificate     /etc/nginx/conf.d/ssl/game.dantezcx.vip.pem;
    ssl_certificate_key /etc/nginx/conf.d/ssl/game.dantezcx.vip.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:8123;
        proxy_http_version 1.1;
        # 关键：保留完整 Host（含端口），否则 dsh 信任检查 403
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# DSH 管理服务反代（桌面管理页 + 移动端 UI）
